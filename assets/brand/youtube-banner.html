<!doctype html>
<!--
  Kalamari — YouTube channel banner (source)

  Canvas:      2560 × 1440  (YouTube's recommended upload size, 6 MB max)
  Safe area:   centre 1546 × 423 is the only part guaranteed visible on every
               device (x 507–2053, y 508–931). Everything that matters sits there.
  Visible:     desktop 2560 × 423 · tablet 1855 × 423 · mobile 1546 × 423 · TV 2560 × 1440

  To re-render: open this file at a 2560 × 1440 viewport and screenshot the stage.
  Wordmark paths are copied from assets/img/logo.svg — update both if the logo changes.
-->
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Kalamari — YouTube banner 2560 × 1440</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2560px;height:1440px;overflow:hidden;background:#061f28}

  #stage{
    position:relative;width:2560px;height:1440px;overflow:hidden;
    background:
      linear-gradient(180deg,#072631 0%,#0a3845 34%,#0f4c5d 50%,#0a3845 66%,#061f28 100%);
  }

  /* subtle grain — keeps the gradient from banding after YouTube re-encodes it */
  .layer{position:absolute;inset:0}
  .grain{opacity:.5;mix-blend-mode:overlay;pointer-events:none}

  .lockup{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    transform:translateY(-12px);            /* optical centring of the ink, not the boxes */
  }

  .wordmark{width:1140px;display:block}
  .gap{height:52px}

  .tagline{
    font-family:Inter,"Segoe UI",system-ui,sans-serif;
    font-weight:400;font-size:60px;line-height:1;letter-spacing:-.006em;
    color:rgba(250,250,247,.86);white-space:nowrap;
  }
</style>
</head>
<body>
<div id="stage">
  <div class="layer grain">
    <svg width="100%" height="100%">
      <filter id="n">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#n)" opacity="0.2"/>
    </svg>
  </div>

  <div class="lockup">
    <svg class="wordmark" viewBox="-10 2 810 152" aria-hidden="true" focusable="false">
      <g fill="none" stroke="#FAFAF7" stroke-width="18" stroke-linecap="butt" stroke-linejoin="miter">
        <path d="M9 15 V140"/><path d="M9 88 L63 40"/><path d="M9 88 L58 140"/>
        <path d="M236 15 V140"/>
        <path d="M317 47 A43 43 0 1 0 317 133 A43 43 0 1 0 317 47"/>
        <path d="M360 40 V140"/>
        <path d="M404 140 V82 A34 34 0 0 1 472 82 V140"/>
        <path d="M472 82 A34 34 0 0 1 540 82 V140"/>
        <path d="M627 47 A43 43 0 1 0 627 133 A43 43 0 1 0 627 47"/>
        <path d="M670 40 V140"/><path d="M714 40 V140"/>
        <path d="M714 82 A34 34 0 0 1 748 48"/>
        <path d="M781 40 V140"/>
      </g>
      <path fill="#FAFAF7" fill-rule="evenodd" d="M148 24 L201 140 H95 Z M148 50.5 L183.9 129 H112.1 Z M148 79.4 L165.2 117 H130.8 Z M148 96.2 L154.3 110 H141.7 Z"/>
      <circle cx="781" cy="24" r="9.5" fill="#FAFAF7"/>
    </svg>

    <div class="gap"></div>

    <p class="tagline">Productivity and wellbeing apps, made in Canberra.</p>
  </div>
</div>
</body>
</html>
